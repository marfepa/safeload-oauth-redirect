<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SafeLoad OAuth Redirect</title>
  <script>
    // 1) Leemos el código de la URL
    const params = new URLSearchParams(window.location.search);
    const code   = params.get('code');
    // 2) Si existe, lanzamos el deep link
    if (code) {
      // Asegúrate de que aquí coincide tu esquema/host con el del manifest:
      const deepLink = `com.example.trainingloadmonitor://strava-callback?code=${code}`;
      window.location.replace(deepLink);
    } else {
      document.body.textContent = 'OAuth failed: no code in query string.';
    }
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
