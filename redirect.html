<!DOCTYPE html>
<meta charset="utf-8">
<title>Strava → SafeLoad</title>
<script>
  // Captura el código que Strava nos devuelve
  const params = new URLSearchParams(window.location.search);
  const code   = params.get("code");
  // Reenvía al esquema custom de tu app
  window.location = `SafeLoad://com.training.loadmonitor?code=${code}`;
</script>
<p>Redirigiendo a SafeLoad…</p>
